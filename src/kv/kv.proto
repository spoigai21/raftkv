// Wire and log formats for the key-value layer. As with raft/messages.proto, only
// kv/messages.cpp touches these generated types.
syntax = "proto3";

package raftkv.kv.pb;

option optimize_for = LITE_RUNTIME;

enum Op {
  OP_UNSPECIFIED = 0;
  GET = 1;
  PUT = 2;
  APPEND = 3;
}

// What goes into the Raft log. (client_id, seq) identifies it for duplicate detection.
message Command {
  uint64 client_id = 1;
  uint64 seq = 2;
  Op op = 3;
  string key = 4;
  bytes value = 5;
}

// The state machine, for Raft snapshots (implementation guide Phase 8). Repeated fields in
// key order rather than maps, so the same state always encodes to the same bytes.
message KvSnapshot {
  message Pair {
    string key = 1;
    bytes value = 2;
  }
  message Session {   // duplicate detection: without these, a snapshot would forget them
    uint64 client_id = 1;
    uint64 last_seq = 2;
    bytes last_value = 3;
    bool last_found = 4;
  }
  repeated Pair data = 1;
  repeated Session sessions = 2;
}

message KvRequest {
  Command command = 1;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  OK = 1;
  NOT_LEADER = 2;
}

message KvReply {
  uint64 client_id = 1;
  uint64 seq = 2;
  Status status = 3;
  bytes value = 4;        // Get: the value; Put/Append: empty
  bool found = 5;         // Get: whether the key existed
  uint32 leader_hint = 6; // NOT_LEADER: who to try instead, 0 if unknown
}
