// Wire format for Raft RPCs. Raft code never sees these types directly: it works with the
// plain structs in raft/messages.hpp, which encode to and decode from these.
syntax = "proto3";

package raftkv.raft.pb;

option optimize_for = LITE_RUNTIME;

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message RequestVote {
  uint64 term = 1;
  uint32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  bool pre_vote = 5;   // "would you vote for me in this term?" Changes nothing on the receiver.
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
  bool pre_vote = 3;   // answers a pre-vote
}

message AppendEntries {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}

// Sent instead of AppendEntries to a follower whose next entry the leader has compacted away
// (implementation guide Phase 8, Figure 13 of the paper). The snapshot travels in one message.
message InstallSnapshot {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotReply {
  uint64 term = 1;
  uint64 match_index = 2;   // the follower's log now matches the leader's up to here
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;      // on success: last index known to match the leader
  uint64 conflict_index = 4;   // on failure: where the leader should retry from
  uint64 conflict_term = 5;    // on failure: term of the conflicting entry, 0 if none
}
